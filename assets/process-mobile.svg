    #vector-process-600 .drift{animation:vector-process-600-float 10s ease-in-out infinite}
    #vector-process-600 .orbit{transform-box:fill-box;transform-origin:center;animation:vector-process-600-orbit 40s linear infinite}
    #vector-process-600 .enter{animation:vector-process-600-enter 1.4s ease-out both}
    #vector-process-600 .scan{animation:vector-process-600-sweep 15s linear infinite}
    #vector-process-600 .trace{stroke-dasharray:18 92;animation:vector-process-600-trace 4s linear infinite}
    #vector-process-600 .pulse{animation:vector-process-600-pulse 4s ease-in-out infinite}
    #vector-process-600 .type{animation:vector-process-600-reveal 12s steps(36,end) infinite}
    #vector-process-600 .cursor{animation:vector-process-600-blink 1.3s step-end infinite}
    @media(prefers-reduced-motion:reduce){#vector-process-600 *{animation:none!important}#vector-process-600 .scan,#vector-process-600 .cursor{display:none}}

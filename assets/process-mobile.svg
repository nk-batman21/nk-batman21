<title id="vector-process-600-title">Process · Batman21</title>
<desc id="vector-process-600-desc">How I contribute: reproduce a real failure; make a focused patch and test it; share upstream.</desc>
<style>
    @keyframes vector-process-600-float {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes vector-process-600-orbit {to{transform:rotate(360deg)}}

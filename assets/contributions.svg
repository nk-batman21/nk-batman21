    #vector-contributions-1200 .drift{animation:vector-contributions-1200-float 10s ease-in-out infinite}
    #vector-contributions-1200 .orbit{transform-box:fill-box;transform-origin:center;animation:vector-contributions-1200-orbit 40s linear infinite}
    #vector-contributions-1200 .enter{animation:vector-contributions-1200-enter 1.4s ease-out both}
    #vector-contributions-1200 .scan{animation:vector-contributions-1200-sweep 15s linear infinite}
    #vector-contributions-1200 .trace{stroke-dasharray:18 92;animation:vector-contributions-1200-trace 4s linear infinite}
    #vector-contributions-1200 .pulse{animation:vector-contributions-1200-pulse 4s ease-in-out infinite}
    #vector-contributions-1200 .type{animation:vector-contributions-1200-reveal 12s steps(36,end) infinite}
    #vector-contributions-1200 .cursor{animation:vector-contributions-1200-blink 1.3s step-end infinite}
    @media(prefers-reduced-motion:reduce){#vector-contributions-1200 *{animation:none!important}#vector-contributions-1200 .scan,#vector-contributions-1200 .cursor{display:none}}
    </style>

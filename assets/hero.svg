<svg xmlns="http://www.w3.org/2000/svg" id="vector-hero-1200" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="vector-hero-1200-title vector-hero-1200-desc">
<title id="vector-hero-1200-title">Hero · Batman21</title>
<desc id="vector-hero-1200-desc">Batman21. An independent developer and open-source contributor. LESS NOISE. MORE USEFUL CODE.</desc>
<style>
    @keyframes vector-hero-1200-float {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes vector-hero-1200-orbit {to{transform:rotate(360deg)}}
    @keyframes vector-hero-1200-enter {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes vector-hero-1200-sweep {0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
    @keyframes vector-hero-1200-trace {to{stroke-dashoffset:-110}}
    @keyframes vector-hero-1200-pulse {0%,100%{opacity:.32}50%{opacity:1}}
    @keyframes vector-hero-1200-reveal {0%,4%{clip-path:inset(0 100% 0 0)}30%,90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
    @keyframes vector-hero-1200-blink {0%,48%{opacity:1}49%,100%{opacity:0}}
    #vector-hero-1200 .drift{animation:vector-hero-1200-float 10s ease-in-out infinite}
    #vector-hero-1200 .orbit{transform-box:fill-box;transform-origin:center;animation:vector-hero-1200-orbit 40s linear infinite}
    #vector-hero-1200 .enter{animation:vector-hero-1200-enter 1.4s ease-out both}
    #vector-hero-1200 .scan{animation:vector-hero-1200-sweep 15s linear infinite}
    #vector-hero-1200 .trace{stroke-dasharray:18 92;animation:vector-hero-1200-trace 4s linear infinite}
    #vector-hero-1200 .pulse{animation:vector-hero-1200-pulse 4s ease-in-out infinite}
    #vector-hero-1200 .type{animation:vector-hero-1200-reveal 12s steps(36,end) infinite}
    #vector-hero-1200 .cursor{animation:vector-hero-1200-blink 1.3s step-end infinite}
    @media(prefers-reduced-motion:reduce){#vector-hero-1200 *{animation:none!important}#vector-hero-1200 .scan,#vector-hero-1200 .cursor{display:none}}
    </style>
